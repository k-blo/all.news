  <script>
    const chev = '<svg class="chev" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';

    // Absolute path (this page is also served at /archive) and ?v=2 to bust the
    // year-long `immutable` copies cached before that was fixed — see script.js.
    Promise.all([fetch("/archive/index.json?v=2").then((r) => r.json()), I18N.ready])
      .then(([idx]) => {
        const root = document.getElementById("archive");
        const dates = (idx.dates || []).slice().sort().reverse(); // newest first

        // Append the year to the month header only when the archive spans more
        // than one year, so a single year stays clean (just "August") while two
        // Augusts never collide.
        const multiYear = new Set(dates.map((d) => d.split("-")[0])).size > 1;

        // Group dates by year-month, preserving newest-first order.
        const groups = [];
        const byKey = {};
        for (const d of dates) {
          const [y, m] = d.split("-");
          const key = `${y}-${m}`;
          if (!byKey[key]) {
            byKey[key] = { label: multiYear ? I18N.monthYear(+m, y) : I18N.month(+m), days: [] };
            groups.push(byKey[key]);
          }
          byKey[key].days.push(d);
        }

        if (!groups.length) {
          root.textContent = I18N.t("archive_missing");
          return;
        }

        groups.forEach((g, i) => {
          const det = document.createElement("details");
          det.className = "archive-month";
          if (i === 0) det.open = true; // newest month expanded by default

          const sum = document.createElement("summary");
          sum.className = "month-head";
          sum.innerHTML = `<span></span>${chev}`;
          sum.firstChild.textContent = g.label;
          det.appendChild(sum);

          const days = document.createElement("div");
          days.className = "month-days";
          for (const d of g.days) {
            const a = document.createElement("a");
            a.className = "day-row";
            a.href = `archive/${d}.html`;
            a.innerHTML = `<span></span>${chev}`;
            a.firstChild.textContent = I18N.date(d);
            days.appendChild(a);
          }
          det.appendChild(days);
          root.appendChild(det);
        });
      })
      .catch(() => {
        I18N.ready.then(() => {
          document.getElementById("archive").textContent = I18N.t("archive_missing");
        });
      });
  </script>
